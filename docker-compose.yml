version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: easybook-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: easybook
      POSTGRES_PASSWORD: easybook_dev_secret
      POSTGRES_DB: easybook_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easybook -d easybook_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: easybook-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://easybook:easybook_dev_secret@postgres:5432/easybook_db?schema=public"
      JWT_SECRET: "easybook-super-secret-jwt-key-2026-secure-token"
      TIMEZONE: "Asia/Kuala_Lumpur"
      PAYMENT_SECRET_KEY: "mock"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
