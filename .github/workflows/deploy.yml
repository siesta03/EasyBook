name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Database Migration & Production Deploy
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://placeholder:placeholder@localhost:5432/easybook_db?schema=public' }}
        run: npx prisma generate

      - name: Sync Prisma Database Schema
        if: env.DATABASE_URL != ''
        run: npx prisma db push --accept-data-loss --skip-generate

      - name: Trigger Production Deployment Webhook
        if: env.DEPLOY_WEBHOOK_URL != ''
        run: |
          echo "Triggering deployment webhook..."
          curl -X POST --fail "$DEPLOY_WEBHOOK_URL"
