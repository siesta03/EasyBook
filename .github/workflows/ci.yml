name: CI

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: easybook_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: easybook_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://easybook_test:test_password@localhost:5432/easybook_test_db?schema=public"
      JWT_SECRET: "ci-test-super-secret-jwt-key-2026"
      TIMEZONE: "Asia/Kuala_Lumpur"
      PAYMENT_SECRET_KEY: "mock"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & push schema to test DB
        run: npx prisma db push

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run Vitest unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build
